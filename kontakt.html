<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LFC – Kontakt</title><link rel="icon" href="lfc.favicon.ico"><link rel="stylesheet" href="assets/css/lfc.background.css"><link rel="stylesheet" href="assets/css/lfc.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="assets/js/config.js"></script><script defer src="assets/js/supabase-client.js"></script><script defer src="assets/js/lfc.background.js"></script><script defer src="assets/js/common.js"></script><script defer src="assets/js/kontakt.js"></script><style>.bt-page{max-width:1200px;margin:0 auto;padding:18px 14px 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.field{margin-bottom:12px}.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);color:inherit}.field textarea{min-height:130px}.btn{padding:10px 12px;border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;cursor:pointer}.status{font-size:13px;min-height:1.1em;opacity:.85}</style></head><body><div id="bt-glow-orbits"></div><div id="bt-points"></div><header id="bt-navbar" class="bt-header"></header><main class="bt-page"><section class="bt-card"><div class="bt-pill"><span class="bt-pill-dot"></span><span>Kontakt</span></div><h1>Kontakt</h1><p class="bt-text-muted">Schreib uns eine Nachricht oder stelle direkt eine Terminanfrage.</p></section><section class="grid" style="margin-top:16px"><form id="kontaktForm" class="bt-card"><h2>Nachricht senden</h2><div class="field"><label>Name *</label><input id="kontaktName" required></div><div class="field"><label>Betreff *</label><input id="kontaktSubject" required></div><div class="field"><label>Nachricht *</label><textarea id="kontaktMessage" required></textarea></div><button class="btn" type="submit">Senden</button><span id="kontaktStatus" class="status"></span></form><form id="terminForm" class="bt-card"><h2>Termin anfragen</h2><p class="bt-text-muted">Di–Fr: 18:30–22:00 · Sa–So: 11:00–22:00</p><div class="field"><label>Name *</label><input id="terminName" required></div><div class="field"><label>Grund *</label><input id="terminReason" required></div><div class="field"><label>Datum *</label><input id="terminDate" type="date" required></div><div class="field"><label>Uhrzeit *</label><input id="terminTime" type="time" step="1800" required></div><button class="btn" type="submit">Termin anfragen</button><span id="terminStatus" class="status"></span></form></section></main><footer id="bt-footer"></footer></body></html>
