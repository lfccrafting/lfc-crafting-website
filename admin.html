<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>LFC – Verwaltung</title>

  <link rel="icon" href="lfc.favicon.ico">
  <link rel="stylesheet" href="assets/css/lfc.background.css">
  <link rel="stylesheet" href="assets/css/lfc.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/supabase-client.js"></script>
  <script defer src="assets/js/lfc.background.js"></script>
  <script defer src="assets/js/common.js"></script>
  <script defer src="assets/js/admin.js"></script>

  <style>
    .bt-page{
      width:100vw;
      max-width:none;
      margin:0;
      padding:22px 12px 34px;
      box-sizing:border-box;
    }

    .bt-page > .bt-card{
      width:100%;
      max-width:none;
      box-sizing:border-box;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:14px 0;
    }

    .tab{
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.18);
      background:transparent;
      color:inherit;
      cursor:pointer;
      transition:border-color .15s ease,color .15s ease,transform .15s ease;
    }

    .tab:hover{
      border-color:rgba(255,153,0,.55);
      color:var(--accent-2,#ffb347);
      transform:translateY(-1px);
    }

    .tab.active{
      border-color:rgba(255,153,0,.75);
      color:var(--accent-2,#ffb347);
      box-shadow:0 0 0 1px rgba(255,153,0,.12);
    }

    .wrap{
      width:100%;
      max-width:none;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    .admin-table{
      width:100%;
      border-collapse:collapse;
    }

    .admin-table th,
    .admin-table td{
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
      text-align:left;
      vertical-align:top;
    }

    .admin-table th{
      font-size:12px;
      letter-spacing:.05em;
      text-transform:uppercase;
      opacity:.9;
    }

    .admin-table.orders-table{
      width:100%;
      min-width:1900px;
      border-collapse:collapse;
    }

    .admin-table.orders-table thead{
      position:relative;
      z-index:50;
    }

    .admin-table.orders-table thead th{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(10,8,7,.98);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:
        0 1px 0 rgba(255,255,255,.12),
        0 10px 24px rgba(0,0,0,.45);
    }

    .input{
      width:100%;
      box-sizing:border-box;
      padding:8px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      color:inherit;
      outline:none;
    }

    .input:focus{
      border-color:rgba(255,153,0,.55);
      box-shadow:0 0 0 1px rgba(255,153,0,.14);
    }

    textarea.input{
      min-height:80px;
      resize:vertical;
    }

    .small{
      font-size:12px;
      opacity:.8;
      line-height:1.4;
    }

    .btn{
      padding:8px 10px;
      border:1px solid rgba(255,255,255,.18);
      background:transparent;
      color:inherit;
      cursor:pointer;
      margin:2px 0;
      transition:border-color .15s ease,color .15s ease,transform .15s ease;
    }

    .btn:hover:not(:disabled){
      border-color:rgba(255,153,0,.55);
      color:var(--accent-2,#ffb347);
      transform:translateY(-1px);
    }

    .btn:disabled{
      opacity:.6;
      cursor:wait;
    }

    .btn-danger{
      border-color:rgba(255,80,80,.35);
    }

    .btn-danger:hover:not(:disabled){
      border-color:rgba(255,80,80,.75);
      color:#ff8c8c;
    }

    .img-editor{
      min-width:320px;
      max-width:460px;
    }

    .img-editor textarea{
      min-height:130px;
      font-family:monospace;
      font-size:12px;
      line-height:1.35;
    }

    .img-preview{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:8px;
      max-width:440px;
    }

    .img-preview-item{
      width:74px;
      height:54px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      overflow:hidden;
      position:relative;
    }

    .img-preview-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .img-preview-item span{
      position:absolute;
      left:3px;
      top:3px;
      font-size:10px;
      background:rgba(0,0,0,.75);
      padding:1px 4px;
      border:1px solid rgba(255,255,255,.16);
    }

    .img-preview-empty{
      font-size:12px;
      opacity:.75;
      padding:7px 8px;
      border:1px dashed rgba(255,255,255,.16);
      margin-top:8px;
    }

    .admin-row-actions{
      display:grid;
      gap:6px;
      min-width:120px;
    }

    .status-line{
      margin-top:10px;
      min-height:1.2em;
    }

    pre{
      white-space:pre-wrap;
      word-break:break-word;
      margin:0;
      font-family:monospace;
      font-size:12px;
    }

    .order-create-card,
    .settings-card{
      max-width:1000px;
      margin:0 auto;
      display:grid;
      gap:12px;
    }

    .order-create-grid,
    .settings-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .shop-field{
      display:grid;
      gap:6px;
    }

    .shop-form{
      display:grid;
      gap:12px;
    }

    .shop-form-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    @media(max-width:800px){
      .order-create-grid,
      .settings-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>
  <div id="bt-glow-orbits" aria-hidden="true"></div>
  <div id="bt-points" aria-hidden="true"></div>

  <header id="bt-navbar" class="bt-header"></header>

  <main class="bt-page">
    <section class="bt-card">
      <div class="bt-pill">
        <span class="bt-pill-dot"></span>
        <span>Verwaltung</span>
      </div>

      <h1>LFC Verwaltung</h1>

      <div id="authStatus" class="bt-hint">Prüfe Login…</div>

      <div class="tabs">
        <button class="tab active" data-tab="vehicles" data-min-role="manager">Katalog</button>
        <button class="tab" data-tab="newOrder" data-min-role="employee">Neuer Auftrag</button>
        <button class="tab" data-tab="openOrders" data-min-role="employee">Offene Aufträge</button>
        <button class="tab" data-tab="finishedOrders" data-min-role="manager">Fertige Aufträge</button>
        <button class="tab" data-tab="contacts" data-min-role="employee">Anfragen</button>
        <button class="tab" data-tab="appointments" data-min-role="employee">Termine</button>
        <button class="tab" data-tab="settings" data-min-role="manager">Einstellungen</button>
      </div>

      <div id="adminStatus" class="status-line small" aria-live="polite"></div>
      <div id="content" class="wrap"></div>
    </section>
  </main>

  <footer id="bt-footer"></footer>
</body>
</html>
