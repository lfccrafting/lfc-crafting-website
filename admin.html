<!DOCTYPE html>
<html lang="de">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>LFC – Admin</title>

  <link rel="icon" href="lfc.favicon.ico">
  <link rel="stylesheet" href="assets/css/lfc.background.css">
  <link rel="stylesheet" href="assets/css/lfc.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/supabase-client.js"></script>
  <script defer src="assets/js/lfc.background.js"></script>
  <script defer src="assets/js/common.js"></script>
  <script defer src="assets/js/admin.js"></script>

  <style>
    .bt-page{
      width:100vw;
      max-width:none;
      margin:0;
      padding:22px 12px 34px;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:14px 0;
    }

    .tab{
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.18);
      background:transparent;
      color:inherit;
      cursor:pointer;
    }

    .tab.active{
      border-color:rgba(255,153,0,.65);
      color:var(--accent-2);
    }

    .wrap{
      overflow:auto;
      width:100%;
      max-width:none;
    }

    .admin-table{
      width:100%;
      border-collapse:collapse;
      min-width:1200px;
    }

    .admin-table th,
    .admin-table td{
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,.08);
      text-align:left;
      vertical-align:top;
    }

    .input{
      width:100%;
      padding:8px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      color:inherit;
      outline:none;
    }

    textarea.input{
      min-height:80px;
      resize:vertical;
    }

    .small{
      font-size:12px;
      opacity:.8;
      line-height:1.4;
    }

    .btn{
      padding:8px 10px;
      border:1px solid rgba(255,255,255,.18);
      background:transparent;
      color:inherit;
      cursor:pointer;
      margin:2px 0;
    }

    .btn:hover{
      border-color:rgba(255,153,0,.55);
      color:var(--accent-2);
    }

    .img-editor{
      min-width:320px;
      max-width:460px;
    }

    .img-editor textarea{
      min-height:130px;
      font-family:var(--bt-font-mono, monospace);
      font-size:12px;
      line-height:1.35;
    }

    .img-preview{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:8px;
      max-width:440px;
    }

    .img-preview-item{
      width:74px;
      height:54px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      overflow:hidden;
      position:relative;
    }

    .img-preview-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .img-preview-item span{
      position:absolute;
      left:3px;
      top:3px;
      font-size:10px;
      background:rgba(0,0,0,.75);
      padding:1px 4px;
      border:1px solid rgba(255,255,255,.16);
    }

    .img-preview-empty{
      font-size:12px;
      opacity:.75;
      padding:7px 8px;
      border:1px dashed rgba(255,255,255,.16);
    }

    .admin-row-actions{
      display:grid;
      gap:6px;
      min-width:110px;
    }

    .status-line{
      margin-top:10px;
      min-height:1.2em;
    }

    pre{
      white-space:pre-wrap;
      word-break:break-word;
      margin:0;
      font-family:var(--bt-font-mono, monospace);
      font-size:12px;
    }
  </style>
</head>

<body>
  <div id="bt-glow-orbits"></div>
  <div id="bt-points"></div>

  <header id="bt-navbar" class="bt-header"></header>

  <main class="bt-page">
    <section class="bt-card">
      <div class="bt-pill">
        <span class="bt-pill-dot"></span>
        <span>Admin</span>
      </div>

      <h1>LFC Verwaltung</h1>

      <div id="authStatus" class="bt-hint">Prüfe Login…</div>

      <div class="tabs">
        <button class="tab active" data-tab="vehicles">Katalog</button>
        <button class="tab" data-tab="newOrder">Neuer Auftrag</button>
        <button class="tab" data-tab="openOrders">Offene Aufträge</button>
        <button class="tab admin-only-tab" data-tab="finishedOrders">Fertige Aufträge</button>
        <button class="tab" data-tab="contacts">Anfragen</button>
      </div>

      <div id="adminStatus" class="status-line small"></div>
      <div id="content" class="wrap"></div>
    </section>
  </main>

  <footer id="bt-footer"></footer>
</body>
</html>
