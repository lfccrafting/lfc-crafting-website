<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>LFC Verwaltung</title>

  <link rel="icon" type="image/x-icon" href="lfc.favicon.ico">

  <link rel="stylesheet" href="assets/css/lfc.background.css">
  <link rel="stylesheet" href="assets/css/lfc.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/supabase-client.js"></script>
  <script defer src="assets/js/lfc.background.js"></script>
  <script defer src="assets/js/common.js"></script>
  <script defer src="assets/js/admin.js"></script>

  <style>
    .bt-page{
      width:100vw;
      max-width:none;
      margin:0;
      padding:22px 12px 34px;
      box-sizing:border-box;
    }

    .bt-page > .bt-card{
      width:100%;
      max-width:none;
      box-sizing:border-box;
    }

    .admin-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .admin-head h1{
      margin:8px 0 6px;
    }

    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:14px 0;
    }

    .tab{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      color:inherit;
      padding:10px 13px;
      cursor:pointer;
      border-radius:999px;
      font-weight:700;
      letter-spacing:.03em;
    }

    .tab.active{
      border-color:rgba(255,153,0,.65);
      background:rgba(255,153,0,.13);
    }

    .wrap{
      width:100%;
      max-width:none;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    .admin-table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }

    .admin-table th,
    .admin-table td{
      border-bottom:1px solid rgba(255,255,255,.09);
      padding:9px 8px;
      vertical-align:top;
      text-align:left;
    }

    .admin-table th{
      color:rgba(255,255,255,.88);
      background:rgba(0,0,0,.25);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.05em;
      white-space:nowrap;
    }

    .admin-table.orders-table{
      min-width:1900px;
    }

    .admin-table.orders-table thead th{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(10,8,7,.98);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:
        0 1px 0 rgba(255,255,255,.12),
        0 10px 24px rgba(0,0,0,.45);
    }

    .input{
      width:100%;
      box-sizing:border-box;
      padding:9px 10px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      color:inherit;
      border-radius:10px;
      outline:none;
    }

    .input:focus{
      border-color:rgba(255,153,0,.55);
      box-shadow:0 0 0 1px rgba(255,153,0,.14);
    }

    textarea.input{
      min-height:86px;
      resize:vertical;
    }

    .status-line{
      min-height:1.4em;
      margin:8px 0 12px;
    }

    .status-line.ok,
    .small.ok{
      color:#7dffb2;
    }

    .status-line.err,
    .small.err{
      color:#ff8c8c;
    }

    .small{
      font-size:12px;
      opacity:.78;
      line-height:1.45;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,153,0,.14);
      color:inherit;
      padding:9px 12px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
      text-decoration:none;
      white-space:nowrap;
    }

    .btn:hover{
      border-color:rgba(255,153,0,.6);
      background:rgba(255,153,0,.22);
    }

    .btn-danger{
      background:rgba(255,80,80,.12);
      border-color:rgba(255,80,80,.22);
    }

    .btn-danger:hover{
      background:rgba(255,80,80,.2);
      border-color:rgba(255,80,80,.45);
    }

    .admin-row-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .img-editor{
      min-width:300px;
    }

    .imageUrls{
      min-height:120px;
      font-family:ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size:12px;
    }

    .img-preview{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:6px;
      margin-top:8px;
    }

    .img-preview-item{
      position:relative;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      aspect-ratio:16/9;
      overflow:hidden;
      border-radius:10px;
    }

    .img-preview-item span{
      position:absolute;
      left:6px;
      top:5px;
      z-index:2;
      font-size:11px;
      background:rgba(0,0,0,.55);
      padding:2px 5px;
      border-radius:999px;
    }

    .img-preview-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .img-preview-empty{
      margin-top:8px;
      opacity:.65;
      font-size:12px;
    }

    .order-create-card{
      max-width:1180px;
    }

    .order-create-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      align-items:start;
    }

    .order-product-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 160px;
      gap:14px;
      align-items:start;
    }

    .order-preview-img{
      width:160px;
      aspect-ratio:16/9;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      border-radius:14px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.58);
      font-size:12px;
      text-align:center;
    }

    .order-preview-img img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .order-summary{
      padding:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.16);
      border-radius:16px;
      line-height:1.55;
    }

    .settings-grid,
    .price-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:12px;
      align-items:end;
    }

    .shop-field{
      display:grid;
      gap:6px;
    }

    .shop-field label{
      font-size:13px;
      opacity:.9;
    }

    @media(max-width:900px){
      .order-create-grid,
      .order-product-row,
      .settings-grid,
      .price-grid{
        grid-template-columns:1fr;
      }

      .order-preview-img{
        width:100%;
      }
    }
  </style>
</head>

<body>
  <div id="bt-glow-orbits" aria-hidden="true"></div>
  <div id="bt-points" aria-hidden="true"></div>

  <header id="bt-navbar" class="bt-header"></header>

  <main class="bt-page">
    <section class="bt-card">
      <div class="admin-head">
        <div>
          <div class="bt-pill">
            <span class="bt-pill-dot"></span>
            <span>Interner Bereich</span>
          </div>

          <h1>LFC Verwaltung</h1>
          <div id="authStatus" class="bt-hint">Prüfe Login…</div>
        </div>

        <a class="btn" href="login.html">Login / Account</a>
      </div>

      <div class="tabs" aria-label="Verwaltungsbereiche">
        <button class="tab active" data-tab="vehicles" data-min-role="manager">Katalog</button>
        <button class="tab" data-tab="itemPrices" data-min-role="manager">Rohstoffpreise</button>
        <button class="tab" data-tab="newOrder" data-min-role="employee">Neuer Auftrag</button>
        <button class="tab" data-tab="openOrders" data-min-role="employee">Offene Aufträge</button>
        <button class="tab" data-tab="finishedOrders" data-min-role="manager">Fertige Aufträge</button>
        <button class="tab" data-tab="contacts" data-min-role="employee">Anfragen</button>
        <button class="tab" data-tab="appointments" data-min-role="employee">Termine</button>
        <button class="tab" data-tab="settings" data-min-role="manager">Einstellungen</button>
      </div>

      <div id="adminStatus" class="status-line small" aria-live="polite"></div>

      <div id="content" class="wrap"></div>
    </section>
  </main>

  <footer id="bt-footer"></footer>
</body>
</html>
