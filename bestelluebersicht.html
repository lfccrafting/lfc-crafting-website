<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>LFC – Bestellübersicht</title>
    <link rel="icon" href="lfc.favicon.ico">
    <link rel="stylesheet" href="assets/css/lfc.background.css">
    <link rel="stylesheet" href="assets/css/lfc.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/supabase-client.js"></script>
    <script defer src="assets/js/lfc.background.js"></script>
    <script defer src="assets/js/common.js"></script>
    <script defer src="assets/js/bestelluebersicht.js"></script>
    <style>
        .bt-page{max-width:1200px;margin:0 auto;padding:22px 14px 34px}.price-card{margin-top:14px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.30);backdrop-filter:blur(12px);box-shadow:0 24px 55px rgba(0,0,0,.55);overflow:auto}.price-table{width:100%;border-collapse:collapse;min-width:720px}.price-table th,.price-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:14px}.price-table th{text-transform:uppercase;letter-spacing:.08em;font-size:12px;opacity:.85;background:rgba(255,255,255,.04)}.price-muted{opacity:.7;font-size:13px;padding:10px 12px}
    </style>
</head>

<body>
    <div id="bt-glow-orbits"></div>
    <div id="bt-points"></div>
    <header id="bt-navbar" class="bt-header"></header>
    <main class="bt-page">
        <section class="bt-card">
            <div class="bt-pill"><span class="bt-pill-dot"></span><span>Bestellübersicht</span></div>
            <h1>Aktuelle Statusübersicht</h1>
            <p class="bt-text-muted">Öffentliche Übersicht aktueller Aufträge.</p>
            <div id="status" class="bt-hint">Lade Daten …</div>
        </section>
        <section class="price-card">
            <table class="price-table">
                <thead>
                    <tr>
                        <th>Eingang der Bestellung</th>
                        <th>Auftragsnummer</th>
                        <th>Zusätzliche Infos</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr>
                        <td colspan="4" class="price-muted">Lade Daten …</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer id="bt-footer"></footer>
</body>

</html>
