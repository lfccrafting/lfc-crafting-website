<!DOCTYPE html><html lang="de"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LFC – Fahrzeugkatalog</title>
<link rel="icon" href="lfc.favicon.ico"><link rel="stylesheet" href="assets/css/lfc.background.css"><link rel="stylesheet" href="assets/css/lfc.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="assets/js/config.js"></script><script defer src="assets/js/supabase-client.js"></script><script defer src="assets/js/lfc.background.js"></script><script defer src="assets/js/common.js"></script><script defer src="assets/js/katalog.js"></script>
</head><body><div id="bt-glow-orbits" aria-hidden="true"></div><div id="bt-points" aria-hidden="true"></div><header id="bt-navbar" class="bt-header"></header>
<main class="bt-main bt-page-shop"><div class="bt-card bt-page-shop-header"><div class="bt-pill"><span class="bt-pill-dot"></span><span>Fahrzeugkatalog</span></div><div class="shop-search-section"><div class="shop-search-bar"><input id="shopSearch" class="shop-search-input" type="search" placeholder="Suche nach Fahrzeug, Beschreibung … 🔍" autocomplete="off"><div id="shopSearchInfo" class="shop-search-info"></div></div><div id="shopGroupNav" class="shop-group-nav"></div></div><div id="shopStatus" class="bt-hint">🔄 Fahrzeugdaten werden geladen …</div></div><div id="shopNoResults" class="shop-no-results"><strong>Keine Treffer.</strong> Bitte Suchbegriff ändern oder löschen.</div><div id="shopContent"></div><div class="bt-hint bt-text-muted" style="margin-top:2rem">Hinweise: Preise & Daten können sich ändern. Für genaue Details bitte eine Anfrage senden.</div></main>
<div id="shopModal" class="shop-modal" aria-hidden="true"><div class="shop-modal-backdrop"></div><div class="shop-modal-dialog"><div class="shop-modal-header"><h2 id="shopModalTitle" class="shop-modal-title">Fahrzeug</h2><button id="shopModalClose" class="shop-modal-close">×</button></div><div id="shopModalContent" class="shop-modal-body"></div></div></div>
<div id="requestModal" class="shop-modal" aria-hidden="true"><div class="shop-modal-backdrop"></div><div class="shop-modal-dialog shop-request-dialog"><div class="shop-modal-header"><h2 class="shop-modal-title">Anfrage</h2><button id="requestModalClose" class="shop-modal-close">×</button></div><div class="shop-modal-body"><form id="requestForm" class="shop-form"><div id="requestSummary" class="shop-form-summary"></div><div class="shop-form-grid"><div class="shop-field"><label for="reqName">Name *</label><input id="reqName" required></div><div class="shop-field"><label for="reqKontakt">Kontakt *</label><input id="reqKontakt" required></div></div><div class="shop-field"><label for="reqNote">Notiz</label><textarea id="reqNote" placeholder="Optional: Farbe, Sonderwünsche, Termin …"></textarea></div><div class="shop-form-actions"><button id="requestCancel" class="shop-form-cancel" type="button">Abbrechen</button><button id="requestSend" class="shop-form-submit" type="submit">Anfrage senden</button></div><div id="requestStatus" class="shop-form-status"></div></form></div></div></div>
<div id="imageLightbox" class="shop-img-lightbox" aria-hidden="true"><div class="shop-img-lightbox-backdrop"></div><img id="imageLightboxImg" class="shop-img-lightbox-img" alt=""></div><footer id="bt-footer"></footer></body></html>
